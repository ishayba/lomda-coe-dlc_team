<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדת AI-DLC – מעבר לרמות 3 ו-4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --ink:#1A2233; --muted:#5B667A; --line:#DCE1E8;
  --navy:#1E3354; --navy-2:#2A4570; --on-navy:#FFFFFF; --on-navy-muted:#B9C5D8;
  --accent:#DE7F3A; --accent-soft:#FBEBDD; --good:#2F7D3E; --good-soft:#E6F2E7;
  --bad:#B4372F; --bad-soft:#F8E3E1; --code-bg:#EEF1F5;
  --radius-s:6px; --radius-m:10px;
  --font:'Rubik', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --surface:#172238; --ink:#E6EAF1; --muted:#9AA6BA; --line:#2A3752;
    --navy:#14233D; --navy-2:#22385E; --on-navy:#F2F5FA; --on-navy-muted:#93A3BE;
    --accent:#F0954F; --accent-soft:#3A2A1E; --good:#6BC07A; --good-soft:#1C3324;
    --bad:#EE7B72; --bad-soft:#3A1F1E; --code-bg:#1E2B45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#172238; --ink:#E6EAF1; --muted:#9AA6BA; --line:#2A3752;
  --navy:#14233D; --navy-2:#22385E; --on-navy:#F2F5FA; --on-navy-muted:#93A3BE;
  --accent:#F0954F; --accent-soft:#3A2A1E; --good:#6BC07A; --good-soft:#1C3324;
  --bad:#EE7B72; --bad-soft:#3A1F1E; --code-bg:#1E2B45; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--code-bg);padding:1px 6px;border-radius:4px;direction:ltr;unicode-bidi:isolate}

/* ---------- header + progress rail ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);padding:14px 20px 12px}
.slogan{max-width:1240px;margin:-4px auto 8px;font-size:12px;line-height:1.4;color:var(--on-navy-muted);opacity:.85;text-align:center}
.top-row{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mark{font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--accent);color:#1A1208;padding:6px 10px;border-radius:var(--radius-s);direction:ltr;white-space:nowrap}
.brand-text{min-width:0}
.org{font-size:13px;color:var(--on-navy-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--on-navy);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.top-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center}
#menuBtn{display:none}

.rail-wrap{max-width:1240px;margin:14px auto 0}
.rail{display:flex;gap:10px;align-items:flex-end}
.seg{min-width:0}
.seg-label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--on-navy-muted);margin-bottom:6px;white-space:nowrap}
.seg.is-current .seg-label{color:var(--on-navy)}
.seg-label b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;gap:3px;height:12px;align-items:center}
.tick{flex:1;height:6px;border:0;padding:0;border-radius:3px;background:rgba(255,255,255,.18);cursor:pointer;position:relative;transition:height .15s}
.tick.done{background:var(--on-navy-muted)}
.tick.current{background:var(--accent);height:12px}
.tick:hover{height:10px}
.where{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13.5px;color:var(--on-navy-muted)}
.where strong{color:var(--on-navy);font-weight:600}
.pin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-inline-end:6px;vertical-align:1px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:32px 20px 120px}
.outline{position:sticky;top:178px;align-self:start;max-height:calc(100vh - 200px);overflow:auto;padding-inline-end:4px}
.outline h3{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.outline h3:first-child{margin-top:0}
.outline ol{list-style:none;margin:0;padding:0}
.outline a{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:var(--radius-s);color:var(--ink);text-decoration:none;font-size:15px;line-height:1.4}
.outline a:hover{background:var(--surface)}
.outline a.current{background:var(--surface);box-shadow:inset -3px 0 0 var(--accent);font-weight:600}
.dot{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.done .dot{background:var(--good);border-color:var(--good)}
.done .dot::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(-45deg) scaleX(-1);margin-top:-2px}
.current .dot{border-color:var(--accent)}
.outline-foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.link-btn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

main{min-width:0;max-width:760px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}
h1{font-size:clamp(28px,4vw,38px);line-height:1.2;margin:0 0 18px;font-weight:700;color:var(--navy)}
:root[data-theme="dark"] h1{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}
h2{font-size:21px;margin:34px 0 10px;font-weight:600}
p{margin:0 0 14px}
.lead{font-size:19px;color:var(--muted);margin-bottom:24px}
ul.plain{padding-inline-start:20px;margin:0 0 16px}
ul.plain li{margin-bottom:6px}

.note{border-inline-start:4px solid var(--good);background:var(--good-soft);padding:14px 18px;border-radius:var(--radius-s);margin:20px 0}
.note.coe{border-color:var(--accent);background:var(--accent-soft)}
.note b{display:block;margin-bottom:2px}

.table-scroll{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13.5px;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

pre{background:var(--code-bg);padding:14px 16px;border-radius:var(--radius-m);overflow-x:auto;direction:ltr;text-align:left;margin:0;font-size:14px;line-height:1.55}
pre code{background:none;padding:0}
.code-box{position:relative;margin:14px 0 20px}
.copy{position:absolute;top:8px;left:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);font-size:12.5px;padding:3px 10px;cursor:pointer}

/* phase strip */
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 0}
.phase-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:12px 8px 10px;cursor:pointer;text-align:center;position:relative}
.phase-btn .pn{display:block;font-weight:600;font-size:15px}
.phase-btn .pr{display:block;font-size:12.5px;color:var(--muted);direction:ltr}
.phase-btn .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:8px}
.phase-btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.phase-btn[aria-pressed="true"] .bar{background:var(--accent)}
.panel{border:1px solid var(--line);border-top:0;background:var(--surface);padding:16px 18px;border-radius:0 0 var(--radius-m) var(--radius-m);margin-bottom:22px}
.panel h4{margin:0 0 6px;font-size:17px}

/* anatomy */
.anat{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;counter-reset:a}
.anat button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.anat button::before{counter-increment:a;content:counter(a);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg);margin-inline-end:8px;font-size:12.5px;font-weight:600}
.anat button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.anat button[aria-pressed="true"]::before{background:var(--accent);color:#1A1208}
.anat-panel{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);padding:16px 18px;margin:10px 0 22px}

/* filters */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
tr.dim td{opacity:.35}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);padding:18px 20px;margin:18px 0}
.quiz .qn{font-size:13px;color:var(--muted);margin-bottom:4px}
.quiz .qq{font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-s);padding:10px 14px;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.why{margin-top:12px;font-size:15.5px}
.why b{color:var(--good)}
.why.no b{color:var(--bad)}
.retry{margin-inline-start:8px}

/* checklists */
.checks{list-style:none;padding:0;margin:12px 0 22px;display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 14px;cursor:pointer;line-height:1.5}
.checks input{width:19px;height:19px;margin-top:3px;accent-color:var(--good);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.count{font-size:14px;color:var(--muted)}

/* welcome */
.hero{padding:8px 0 10px}
.hero h1{font-size:clamp(32px,5vw,48px);max-width:16ch}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:28px 0 34px;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--surface)}
.path div{padding:16px 18px;border-inline-start:1px solid var(--line)}
.path div:first-child{border-inline-start:0}
.path .n{font-size:13px;color:var(--accent);font-weight:600}
.path .t{font-weight:600;font-size:17px;margin:2px 0}
.path .d{font-size:14.5px;color:var(--muted);line-height:1.5}
.personas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 26px}
.persona{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:12px 14px;cursor:pointer;text-align:start;line-height:1.4}
.persona input{margin-top:4px;accent-color:var(--accent);flex:none}
.persona .pt{font-weight:600}
.persona .pd{font-size:14px;color:var(--muted)}
.persona:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--radius-s);padding:12px 22px;font-weight:600;font-size:16px;cursor:pointer;background:var(--navy);color:var(--on-navy)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* pager */
.pager{position:fixed;inset:auto 0 0 0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.pager-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pager .hint{flex:1;font-size:14px;color:var(--muted);text-align:center}

/* certificate */
.cert{border:2px solid var(--navy);border-radius:var(--radius-m);background:var(--surface);padding:34px 30px;text-align:center;margin:22px 0;position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:6px;pointer-events:none}
.cert .co{font-size:14px;color:var(--muted)}
.cert .cn{font-size:30px;font-weight:700;margin:14px 0 4px;color:var(--navy);min-height:44px}
.cert .cd{color:var(--muted);font-size:15px}
.stats{display:flex;justify-content:center;gap:32px;margin:18px 0 6px;flex-wrap:wrap}
.stats div{font-size:14px;color:var(--muted)}
.stats strong{display:block;font-size:22px;color:var(--ink)}
.field{display:grid;gap:6px;margin:16px 0}
.field input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);max-width:360px}

.scrim{display:none}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr;padding-top:22px;gap:0}
  #menuBtn{display:grid}
  .outline{position:fixed;inset:0 0 0 auto;top:0;width:min(86vw,340px);max-height:none;height:100%;background:var(--bg);z-index:40;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 30px;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .outline.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:35}
  .org{display:none}
  .phases{grid-template-columns:repeat(5,minmax(96px,1fr));overflow-x:auto}
  .path{grid-template-columns:1fr}
  .path div{border-inline-start:0;border-top:1px solid var(--line)}
  .path div:first-child{border-top:0}
  .personas{grid-template-columns:1fr}
  .seg-label > span{display:none}
  .seg:not(.is-current) .nm{display:none}
  .where{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- מידע לא מאומת ---------- */
.vi{display:inline-grid;place-items:center;width:19px;height:19px;padding:0;margin-inline-start:5px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:italic 700 12px/1 Georgia,'Times New Roman',serif;cursor:help;vertical-align:1px}
.vi::before{content:"i"}
.vi:hover,.vi[aria-expanded="true"]{background:var(--accent);color:#1A1208}
#viTip{position:fixed;z-index:90;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.55;box-shadow:0 10px 28px rgba(0,0,0,.28);pointer-events:none}
#viTip b{display:block;margin-bottom:3px}
.legend{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin:6px 0 14px}
.sources{font-size:15px}
.sources li{margin-bottom:6px}
.sources a{color:var(--ink)}
.copy-line{display:block;margin-top:4px;font-weight:500}
.cert{background-repeat:repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert .cid{font-size:12.5px;color:var(--muted);margin-top:14px}
.cert .cid bdi{font-family:var(--mono)}
main:focus{outline:none}
.cert .cc{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- נגישות ---------- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;top:-100px;right:12px;z-index:100;background:var(--accent);color:#1A1208;padding:10px 16px;border-radius:var(--radius-s);font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.top,.layout,.pager{zoom:var(--zoom,1)}
.pop-wrap{position:relative}
.top-btn.active{background:rgba(255,255,255,.16);border-color:var(--on-navy)}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:50;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 150px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 16px 16px;text-align:start}
.pop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pop-head b{font-size:16px}
.x{background:none;border:0;font-size:22px;line-height:1;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted)}
.x:hover{background:var(--bg)}
.a-sec{padding:10px 0;border-top:1px solid var(--line)}
.a-lbl{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.seg-ctl,.step-ctl,.read-ctl{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg-ctl button,.step-ctl button,.read-ctl button{flex:1;border:0;border-inline-start:1px solid var(--line);background:var(--surface);padding:8px 6px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.seg-ctl button:first-child,.step-ctl button:first-child,.read-ctl button:first-child{border-inline-start:0}
.seg-ctl button[aria-pressed="true"],.read-ctl button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.pop button[disabled]{opacity:.45;cursor:not-allowed}
.a-note{font-size:13px;color:var(--muted);margin-top:6px}
.a-note:empty{display:none}
.tgl{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 2px;cursor:pointer;font-size:15px;text-align:start;color:var(--ink)}
.tgl .tx{flex:1}
.tgl .st{font-size:12.5px;color:var(--muted)}
.sw{flex:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:right .15s}
.tgl[aria-pressed="true"] .sw{background:var(--good)}
.tgl[aria-pressed="true"] .sw::after{right:18px}
.a-reset{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.a11y-btn{display:inline-flex;align-items:center;gap:6px;position:relative}
.a11y-dot{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--navy)}
.stop-read{background:var(--accent);color:#1A1208;border-color:var(--accent);font-weight:600}
.persona-menu{padding:8px}

    <tr><td>סוכנים</td><td>14: אחד-עשר מומחי תחום, 2 סוקרים ו-composer</td></tr>
    <tr><td>פרופילי עבודה</td><td>11</td></tr>
    <tr><td>כלים נתמכים</td><td>Claude Code, Kiro CLI, Kiro IDE, Codex CLI, Cursor, opencode, GitHub Copilot</td></tr>
    </tbody></table></div>
    <div class="note coe"><b>למה ה-CoE מוביל את זה</b>בלי שפה ותהליך משותפים, כל צוות משתמש ב-AI אחרת והתוצאות לא ניתנות להשוואה. הלומדה הזו היא הבסיס המשותף.</div>`},
  {id:'c1-2', title:'ארבעה עקרונות', body:()=>`
    <p class="lead">ארבעה עקרונות מסבירים כמעט כל החלטה ב-workflow.</p>
    <div class="table-scroll"><table><thead><tr><th>עיקרון</th><th>מה זה אומר בפועל</th></tr></thead><tbody>
    <tr><td><b>אדם בלולאה</b></td><td>ה-AI מציע, אדם מאשר. כמעט כל שלב נגמר בשער אישור.</td></tr>
    <tr><td><b>הכול מתועד</b></td><td>תוצרים, מצב ו-audit נשמרים בתיקיית ה-intent – לא נשארים בצ'אט.</td></tr>
    <tr><td><b>אדפטיבי</b></td><td>לא כל עבודה עוברת את כל 33 השלבים. פרופיל (scope) קובע אילו שלבים ובאיזה עומק.</td></tr>
    <tr><td><b>ליבה אחת, כלים רבים</b></td><td>אותו מנוע רץ בכל הכלים הנתמכים, כך שהצוות לא נעול על כלי אחד.</td></tr>
    </tbody></table></div>
    <p>הגישה היא "Small Mob, Broad Agents": מעט סוכנים רחבים במקום הרבה מומחים צרים, כמו צוות קטן של 3–5 אנשים שמכסה פיצ'ר שלם.</p>`},
  {id:'c1-3', title:'חמש הפאזות', body:()=>`
    <p class="lead">33 השלבים מחולקים לחמש פאזות. לחצו על פאזה כדי לראות מה קורה בה.</p>
    <div class="phases" role="group" aria-label="פאזות">${PHASES.map((p,i)=>`<button class="phase-btn" data-phase="${i}" aria-pressed="${i===0}"><span class="pn">${p.name}</span><span class="pr">${p.range}</span><span class="bar"></span></button>`).join('')}</div>
    <div class="panel" id="phasePanel"></div>
    <p>הפאזות רצות לפי הסדר. בין פאזה לפאזה רץ שער אימות שבודק עקיבות – למשל שכל דרישה ממופה לסיפור – לפני שהשלבים הבאים נבנים עליה.</p>`,
    after:el=>{ const show=i=>{ const p=PHASES[i]; el.querySelector('#phasePanel').innerHTML=`<h4>${p.name} · שלבים ${p.range} (${p.count})</h4><p>${p.what}</p><p style="margin:0;color:var(--muted)">מי מעורב: ${p.who}</p>`; el.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.phase==i)); }; show(0); el.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>show(+b.dataset.phase)); }},
  {id:'c1-4', title:'התפקיד שלך משתנה', body:()=>{ const p=persona(); return `
    <p class="lead">בכל התפקידים אותו מעבר: מ"מבצעים" ל"מכוונים ומאשרים".</p>
    ${p?`<div class="note"><b>בתור ${p.name}</b>${p.change}<br><span style="color:var(--muted)">הסוכן שמולו תעבוד/י: ${p.agent} · פאזות עיקריות: ${p.phases}</span></div>`:''}
    <div class="table-scroll"><table><thead><tr><th>פרסונה ${ui('השיוך בין תפקיד בארגון לסוכן הוא פרשנות של ה-CoE. התיעוד מגדיר את הסוכנים ואת השלבים שהם מובילים, לא את התפקידים בארגון.')}</th><th>סוכן AI-DLC</th><th>פאזות עיקריות</th></tr></thead><tbody>
    ${Object.entries(PERSONAS).map(([k,v])=>`<tr${k===state.persona?' style="background:var(--accent-soft)"':''}><td>${v.name}</td><td>${v.agent}</td><td>${v.phases}</td></tr>`).join('')}
    </tbody></table></div>`;}},
  {id:'c1-5', title:'רמות 3 ו-4', body:()=>`
    <p class="lead">רמה 3: ה-AI מציע, האדם מאשר בכל שער. רמה 4: ה-AI מוביל את המחזור כולו, כולל תפעול, והאדם מנהל דרך ידע, כללים, חיישנים ושערים מרכזיים. ${ui('אין ל-AWS מודל רמות רשמי ל-AI-DLC. זו הגדרה שה-CoE הציע על בסיס מודלי בשלות כלליים של AI-SDLC, ויש לאשר אותה בארגון.')}</p>
    <div class="table-scroll"><table><thead><tr><th>ממד</th><th>רמה 3 · AI-assisted</th><th>רמה 4 · AI-native</th></tr></thead><tbody>
    <tr><td>מי מוביל</td><td>האדם, ה-AI מציע תוצרים</td><td>ה-AI, האדם מגדיר כוונה ומאשר בשערים מרכזיים</td></tr>
    <tr><td>פרופילים</td><td>classic, express, bugfix, mvp</td><td>feature, enterprise, infra, compose</td></tr>
    <tr><td>פאזות</td><td>Inception ו-Construction</td><td>כל 33 השלבים, כולל Operation ומשוב</td></tr>
    <tr><td>Construction</td><td>שער אחרי כל שלב</td><td>מצב אוטונומי אחרי walking skeleton, וריצה מקבילית של יחידות</td></tr>
    <tr><td>איכות</td><td>סקירה advisory</td><td>סקירה adversarial וחיישנים חוסמים</td></tr>
    <tr><td>ידע</td><td>ברירות המחדל של המערכת</td><td>ידע צוות לכל סוכן, כללים נלמדים ו-plugins ארגוניים</td></tr>
    </tbody></table></div>`},
  {id:'c1-6', title:'בדיקת ידע', quiz:['c1a','c1b','c1c'], body:()=>`
    <p class="lead">שלוש שאלות לסיום הפרק המקוצר. אפשר לנסות שוב עד שעונים נכון.</p>
    ${quiz('c1a')}${quiz('c1b')}${quiz('c1c')}`}
 ]},
 {id:'c2', name:'המדריך המלא', time:'כ-60 דקות', desc:'התקנה, מבנה הקבצים, מה קורה בתוך שלב, פרופילים, Construction, סוכנים וידע.', steps:[
  {id:'c2-1', title:'התקנה והרצה ראשונה', body:()=>`
    <p class="lead">מגרסה 2 ההתקנה היא פקודה אחת שמוסיפה את הפקודה aidlc, ואז מגדירים כל פרויקט פעם אחת לכלי שלכם.</p>
    <p>macOS, Linux או WSL:</p>
    ${codeBox('curl -fsSL https://github.com/awslabs/aidlc-workflows/releases/latest/download/install.sh | sh')}
    <p>Windows PowerShell (חלון רגיל, לא כמנהל):</p>
    ${codeBox('irm https://github.com/awslabs/aidlc-workflows/releases/latest/download/install.ps1 | iex')}
    <p>הגדרת הפרויקט ובדיקת תקינות, מתיקיית השורש שלו:</p>
    ${codeBox('cd /path/to/your-project\naidlc config --harness claude\naidlc doctor')}
    <p>במקום <code>claude</code> אפשר <code>kiro</code>, <code>kiro-ide</code>, <code>codex</code>, <code>cursor</code>, <code>opencode</code> או <code>copilot</code>. אחר כך פותחים את הכלי ומתארים את העבודה:</p>
    ${codeBox('/aidlc Fix the login timeout bug')}
    <p>ב-Codex CLI הפקודה היא <code>$aidlc</code>. אם אין פרופיל מוגדר ואין התאמה, ברירת המחדל היא classic.</p>
    <div class="note coe"><b>בארגון שלנו</b>אל תתקינו ישירות מ-GitHub. השתמשו בגרסה הנעולה ובמראה הפנימי של ה-CoE: <code>${esc(CONFIG.rulesRepo)}</code>. מדריך Install and Lifecycle בתיעוד מסביר נעילת גרסה, התקנה בלי רשת ושימוש במראה.</div>`},
  {id:'c2-2', title:'מבנה הקבצים', body:()=>`
    <p class="lead">כל העבודה נשמרת תחת התיקייה aidlc בפרויקט: spaces לצוותים, ובתוכם intent לכל יחידת עבודה.</p>
    ${codeBox('aidlc/\n└── spaces/<space>/\n    ├── memory/          # team.md, project.md – כללים ולקחים\n    ├── knowledge/       # ידע ומסמכים של הצוות\n    ├── codekb/          # ידע על הקוד מ-Reverse Engineering\n    └── intents/<YYMMDD>-<label>/\n        ├── aidlc-state.md   # scope, שלב נוכחי, הגדרות\n        ├── audit/           # כל החלטה ואירוע\n        ├── inception/ ...   # תוצרים לכל פאזה שרצה\n        └── verification/')}
    <div class="table-scroll"><table><thead><tr><th>מה</th><th>למה זה חשוב</th></tr></thead><tbody>
    <tr><td><code>aidlc-state.md</code></td><td>שומר את ה-scope, השלב הנוכחי ואת מצב האוטונומיה. /aidlc בלי פרמטרים קורא אותו ומציע להמשיך, לחזור על שלב, לקפוץ או להתחיל מחדש.</td></tr>
    <tr><td><code>audit/</code></td><td>כל החלטה נרשמת, כך שאפשר לדעת מי אישר מה ומתי. זו הראיה לבשלות ולעמידה ברגולציה.</td></tr>
    <tr><td><code>memory/</code></td><td>כללים ולקחים שהצוות אישר. משפיעים על ה-workflows הבאים.</td></tr>
    <tr><td><code>/aidlc --status</code></td><td>תמונת מצב לקריאה בלבד: פאזה, שלב, התקדמות ו-scope.</td></tr>
    </tbody></table></div>`},
  {id:'c2-3', title:'מה קורה בתוך שלב', body:()=>`
    <p class="lead">רוב השלבים עוברים את אותו מסלול. לחצו על כל חלק. ${ui('הסדר כאן הוא מודל הוראה שבנה ה-CoE מפרקי Phases, Agents ו-CLI. הסדר המדויק תלוי בסוג השלב (inline, subagent, pipeline או mob) ובשאלה אם מוגדר לו סוקר.')}</p>
    <div class="anat" role="group" aria-label="חלקי השלב">${ANATOMY.map((a,i)=>`<button data-anat="${i}" aria-pressed="${i===0}">${a.t}</button>`).join('')}</div>
    <div class="anat-panel" id="anatPanel"></div>
    <div class="note"><b>הכלל הכי חשוב</b>שער אישור הוא החלטה, לא טקס. אם לא קראתם את התוצר – אל תאשרו.</div>`,
    after:el=>{ const show=i=>{ const a=ANATOMY[i]; el.querySelector('#anatPanel').innerHTML=`<b>${a.t}</b><p style="margin:4px 0 0">${a.d}${a.note?' '+ui(a.note):''}</p>`; el.querySelectorAll('[data-anat]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.anat==i)); }; show(0); el.querySelectorAll('[data-anat]').forEach(b=>b.onclick=()=>show(+b.dataset.anat)); }},
  {id:'c2-4', title:'פרופילי עבודה', body:()=>`
    <p class="lead">פרופיל (scope) קובע אילו שלבים רצים, באיזה עומק ואיזו סקירה. סננו לפי העומק:</p>
    <div class="chips" role="group" aria-label="סינון לפי עומק">${['הכול','Minimal','Standard','Comprehensive'].map((d,i)=>`<button class="chip" data-depth="${d}" aria-pressed="${i===0}">${d}</button>`).join('')}</div>
    <div class="table-scroll"><table><thead><tr><th>פרופיל</th><th>מתאים ל</th><th>שלבים ${ui('מספרי השלבים לקוחים מדף Workflow Profiles. בפרויקט חדש (greenfield) Reverse Engineering לא רץ, ולכן המספר בפועל יכול להיות נמוך באחד – בפרק CLI, למשל, bugfix מוצג כ-8 מתוך 33.')}</th><th>עומק</th><th>סקירה</th><th>פקודה</th></tr></thead><tbody id="profRows">
    ${PROFILES.map(p=>`<tr data-d="${p.d}"><td><b>${p.n}</b></td><td>${p.use}</td><td class="num">${p.c} / 33</td><td>${p.d}</td><td>${p.r}</td><td><code>${p.cmd}</code></td></tr>`).join('')}
    </tbody></table></div>
    <p>לא חייבים לזכור את הטבלה: מתארים את העבודה, והמערכת מציעה פרופיל עם מספר השלבים והשערים, ומחכה לאישור. תיאור עשיר או לא מוכר מקבל הצעה ל-compose.</p>`,
    after:el=>{ el.querySelectorAll('[data-depth]').forEach(b=>b.onclick=()=>{ el.querySelectorAll('[data-depth]').forEach(x=>x.setAttribute('aria-pressed', x===b)); el.querySelectorAll('#profRows tr').forEach(r=>r.classList.toggle('dim', b.dataset.depth!=='הכול' && r.dataset.d!==b.dataset.depth)); }); }},
  {id:'c2-5', title:'כוונון ופקודות שימושיות', body:()=>`
    <p class="lead">דגלים מכווננים את הפרופיל שנבחר בלי להחליף אותו, וכל שינוי נרשם ב-audit.</p>
    <div class="table-scroll"><table><thead><tr><th>פקודה</th><th>מה היא עושה</th></tr></thead><tbody>
    <tr><td><code>--depth</code></td><td>minimal, standard או comprehensive – כמה מפורטים התוצרים</td></tr>
    <tr><td><code>--test-strategy</code></td><td>minimal (בדיקה אחת לכל דרישה), standard (5–8 לכל רכיב) או comprehensive (10–15 לכל רכיב)</td></tr>
    <tr><td><code>--review</code></td><td>adversarial, advisory או none – תקרה לסקירות. לא מעלה שלב מעל מה שהוא או הפרופיל מגדירים</td></tr>
    <tr><td><code>--scope</code></td><td>החלפת פרופיל ל-workflow פעיל (לא במצב Construction אוטונומי)</td></tr>
    <tr><td><code>--stage &lt;slug&gt; --single</code></td><td>הרצת שלב אחד בנפרד, בלי לקדם את ה-workflow</td></tr>
    <tr><td><code>--status</code> / <code>--doctor</code></td><td>תמונת מצב / בדיקת תקינות של ההתקנה וה-workflow</td></tr>
    </tbody></table></div>
    <p>לעבודה שלא מתאימה לאף פרופיל, ה-composer מציע רשימת שלבים מותאמת עם נימוק לכל שלב שנכלל או נשמט, ומחכה לאישור:</p>
    ${codeBox('/aidlc compose "harden the deployment pipeline and add observability"')}`},
  {id:'c2-6', title:'Construction: יחידות ואוטונומיה', body:()=>`
    <p class="lead">ב-Construction כל שלב רץ לכל היחידות (Units) ואז עוברים לשלב הבא – stage-major. Build and Test ו-CI Pipeline רצים פעם אחת בסוף.</p>
    <ul class="plain">
    <li><b>Walking skeleton:</b> ה-Bolt הראשון בתוכנית. השער שלו, בשלב הראשון של Construction, הוא נקודת הביטחון המוקדמת.</li>
    <li><b>Ladder prompt:</b> מיד אחרי השער הזה נשאלים פעם אחת: להמשיך באופן אוטונומי (בלי שערים לשאר השלבים) או לעצור לשער בכל שלב. התשובה נשמרת ב-aidlc-state.md.</li>
    <li><b>ריצה מקבילית:</b> יחידות שתלויות באותה יחידה ולא זו בזו יכולות לעבור Code Generation במקביל (swarm). unit-major הוא בחירה מפורשת שמבטלת את זה.</li>
    <li><b>כשל עוצר:</b> כשל תמיד עוצר את Construction, גם במצב אוטונומי, ומציע retry, skip או abort.</li>
    <li><b>שינוי תוכנית:</b> במצב אוטונומי אי אפשר לשנות scope או להריץ compose – צריך קודם לחזור למצב עם שערים.</li>
    </ul>
    <div class="note"><b>זה לב רמה 4</b>אוטונומיה שניתנת אחרי שלד עובד ומאושר, עם עצירה בכל כשל, מאפשרת לסוכנים להוביל בלי לאבד שליטה.</div>`},
  {id:'c2-7', title:'14 הסוכנים', body:()=>`
    <p class="lead">אחד-עשר מומחי תחום מבצעים את העבודה, שני סוקרים בודקים אותה, וה-composer מתאים את המסלול.</p>
    <div class="table-scroll"><table><thead><tr><th>סוכן</th><th>תחום</th><th>מוביל, למשל</th></tr></thead><tbody>
    ${AGENTS.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${a[2]}</td></tr>`).join('')}
    </tbody></table></div>
    <p>לכל סוכן יש דף מפורט בתיעוד (Agent deep dives) עם האחריות, השלבים והידע שהוא טוען.</p>`},
  {id:'c2-8', title:'ידע, כללים ולולאת למידה', body:()=>`
    <p class="lead">מה שהצוות יודע ולומד צריך להגיע לסוכנים, כדי שלא יחזרו על אותה טעות.</p>
    <div class="table-scroll"><table><thead><tr><th>מנגנון</th><th>איפה</th><th>מה הוא מחזיק</th></tr></thead><tbody>
    <tr><td><b>ידע לכל סוכן</b></td><td><code>aidlc/knowledge/&lt;agent&gt;/</code></td><td>סטנדרטים של הארגון לסוכן מסוים. לא עורכים את קובצי הסוכנים עצמם – הם נדרסים בשדרוג.</td></tr>
    <tr><td><b>מסמכים</b></td><td><code>knowledge/documents/</code></td><td>PDF, Word ו-Markdown. <code>/aidlc knowledge onboard</code> מאנדקס אותם כדי שהסוכנים יצטטו במקום לנחש.</td></tr>
    <tr><td><b>כללים ולקחים</b></td><td><code>memory/team.md</code>, <code>project.md</code></td><td>לקחים שאושרו ופרקטיקות שהתגלו ב-Practices Discovery.</td></tr>
    <tr><td><b>חיישנים</b></td><td>לכל שלב</td><td>בדיקות דטרמיניסטיות; לקח יכול להוסיף חיישן ברמת הפרויקט.</td></tr>
    </tbody></table></div>
    <div class="note coe"><b>איך מעבירים לקח ל-CoE</b>לקח שחוזר בשני צוותים או יותר נשלח ל-${esc(CONFIG.contact)} ונכנס לידע ולכללים הארגוניים בגרסה הבאה.</div>`},
  {id:'c2-9', title:'תרגיל: בחרו פרופיל', quiz:['s1','s2','s3','s4','s5','c2a','c2b'], body:()=>`
    <p class="lead">חמישה תרחישים ושתי שאלות. בחרו את התשובה המתאימה.</p>
    ${['s1','s2','s3','s4','s5','c2a','c2b'].map(q=>quiz(q)).join('')}`}
 ]},
 {id:'c3', name:'המסלול שלך', time:'כ-30 דקות', desc:'מה ללמוד ברמה 3 וברמה 4 לפי התפקיד, תרגיל מעשי והסמכה.', steps:()=>{ const p=persona(); if(!p) return []; const k=state.persona; return [
  {id:`c3-${k}-1`, title:'התפקיד החדש שלך', body:()=>`
    <p class="lead">${p.change}</p>
    <div class="table-scroll"><table><tbody>
    <tr><th>סוכן</th><td>${p.agent}</td></tr>

function checklist(key, items, intro){

/* ---------------- מצב ושמירה ---------------- */
const state = {persona:null, current:'welcome', done:{}, answers:{}, checks:{}, name:''};
function load(){ try{ const s=localStorage.getItem(CONFIG.storageKey); if(s) Object.assign(state, JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }catch(e){} }

function chapterSteps(ch){ return typeof ch.steps==='function' ? ch.steps() : ch.steps; }
function flat(){ const out=[]; CHAPTERS.forEach((ch,ci)=>chapterSteps(ch).forEach((s,si)=>out.push({...s, ci, si, ch}))); return out; }
function findStep(id){ return flat().find(s=>s.id===id); }
function quizDone(s){ return !s.quiz || s.quiz.every(q=>QUIZ[q] && state.answers[q]===QUIZ[q].a); }

/* ---------------- רינדור ---------------- */
const $ = id => document.getElementById(id);

function renderRail(){
  const all=flat(); const cur=all.findIndex(s=>s.id===state.current);
  $('rail').innerHTML = CHAPTERS.map((ch,ci)=>{
    const steps=chapterSteps(ch); const isCur = cur>=0 && all[cur].ci===ci;
    const doneN = steps.filter(s=>state.done[s.id]).length;
    const ticks = steps.length ? steps.map(s=>`<button class="tick ${state.done[s.id]?'done':''} ${s.id===state.current?'current':''}" data-go="${s.id}" aria-label="${esc(ch.name)}: ${esc(s.title)}"></button>`).join('')
      : `<button class="tick" data-go="welcome" aria-label="בחירת פרסונה לפתיחת הפרק"></button>`;
    return `<div class="seg ${isCur?'is-current':''}" style="flex:${Math.max(steps.length,3)}"><div class="seg-label"><b>פרק ${ci+1}<span class="nm"> · ${ch.name}</span></b><span>${doneN}/${steps.length||'—'}</span></div><div class="ticks">${ticks}</div></div>`;
  }).join('');
  const total=all.length, doneAll=all.filter(s=>state.done[s.id]).length, pct=total?Math.round(doneAll/total*100):0;
  $('rail').setAttribute('role','progressbar'); $('rail').setAttribute('aria-valuenow',pct); $('rail').setAttribute('aria-valuemin',0); $('rail').setAttribute('aria-valuemax',100); $('rail').setAttribute('aria-label','התקדמות בלומדה');

  if(state.current==='welcome') here='<strong>פתיחה</strong> · בחירת פרסונה';
  else if(state.current==='finish') here='<strong>סיום</strong> · תעודה';
  else { const s=all[cur]; const n=chapterSteps(s.ch).length; here=`<strong>פרק ${s.ci+1}, שלב ${s.si+1} מתוך ${n}</strong> · ${esc(s.title)}`; }
  $('where').innerHTML = `<span><span class="pin"></span>אתה כאן: ${here}</span><span>הושלמו ${pct}%</span>`;

function renderOutline(){

    const steps=chapterSteps(ch);
    parts.push(`<h3>פרק ${ci+1} · ${ch.name}</h3><ol>${steps.length? steps.map(s=>`<li><a href="#${s.id}" data-go="${s.id}" class="${s.id===state.current?'current':''} ${state.done[s.id]?'done':''}"><span class="dot"></span>${esc(s.title)}</a></li>`).join('') : `<li><a href="#welcome" data-go="welcome"><span class="dot"></span>בחרו פרסונה כדי לפתוח</a></li>`}</ol>`);

function renderStep(s){
  const n=chapterSteps(s.ch).length;

function renderQuiz(el){
  const id=el.dataset.quiz, q=QUIZ[id], ans=state.answers[id], tried=state.answers[id]!==undefined;
  const ok = tried && ans===q.a;
  el.innerHTML = `<div class="qq">${esc(q.q)}</div><div class="opts">${q.opts.map((o,i)=>{
    let cls=''; if(tried && i===ans) cls = ok?'right':'wrong'; if(ok && i===q.a) cls='right';
    return `<button class="opt ${cls}" data-opt="${i}" ${ok?'disabled':''}><span class="k">${'אבגד'[i]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
    ${tried? `<div class="why ${ok?'':'no'}"><b>${ok?'נכון.':'לא בדיוק.'}</b> ${ok?esc(q.why):'נסו שוב – חשבו על מה שהשער או הפרופיל נועדו להבטיח.'}</div>`:''}`;
  el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ state.answers[id]=+b.dataset.opt; if(state.answers[id]===q.a){ state.firstTry = state.firstTry||{}; if(state.firstTry[id]===undefined) state.firstTry[id]=true; } else { state.firstTry=state.firstTry||{}; state.firstTry[id]=false; } save(); renderQuiz(el); renderPager(); });
}

function certId(){ const src=`${state.name||''}|${state.persona||''}|${CONFIG.appVersion}|${state.issued||''}`; let h=5381; for(const ch of src) h=((h<<5)+h+ch.codePointAt(0))>>>0; return 'AIDLC-'+h.toString(16).toUpperCase().padStart(8,'0'); }

  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1A2233';

function paintCert(){ const c=$('cert'); if(!c) return; c.style.backgroundImage=watermark(); $('certName').textContent=state.name||''; $('certId').innerHTML='מזהה תעודה: <bdi dir="ltr">'+certId()+'</bdi>'; $('printBtn').disabled=!(state.name||'').trim(); }

function renderPager(){
  const all=flat(), i=all.findIndex(s=>s.id===state.current);

  next.style.visibility='visible';
  const s=all[i]; const ok=quizDone(s);

function renderChrome(){

function render(){
  if(state.current!=='welcome' && state.current!=='finish' && !findStep(state.current)) state.current='welcome';
  renderChrome();
  if(state.current==='welcome') renderWelcome();
  else if(state.current==='finish') renderFinish();
  else renderStep(findStep(state.current));
}

function go(id, push=true){
  if(typeof hideTip==='function') hideTip(true);

  state.current=id; save(); render(); closeMenu();

}

try{ const s=JSON.parse(localStorage.getItem(A11Y_KEY)||'null'); if(s){ A.zoom=ZOOMS.includes(s.zoom)?s.zoom:1; A.on=s.on||{}; } }catch(e){}
try{ const t=localStorage.getItem(THEME_KEY); if(t==='light'||t==='dark') theme=t; }catch(e){}
function saveA11y(){ try{ localStorage.setItem(A11Y_KEY, JSON.stringify(A)); if(theme==='auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, theme); }catch(e){} }
$('a11yToggles').innerHTML = TOGGLES.map(([k,t])=>`<button class="tgl" data-a="${k}" aria-pressed="false"><span class="tx">${t}</span><span class="st"></span><span class="sw" aria-hidden="true"></span></button>`).join('');
function a11yChanged(){ return A.zoom!==1 || theme!=='auto' || TOGGLES.some(([k])=>A.on[k]) || RD.on; }
function applyA11y(){
  const r=document.documentElement;
  r.style.setProperty('--zoom', A.zoom);
  if(theme==='auto') delete r.dataset.theme; else r.dataset.theme=theme;
  TOGGLES.forEach(([k])=>r.classList.toggle('a-'+k, !!A.on[k]));
  if(sysStill.matches) r.classList.add('a-still');
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.themeSet===theme));
  document.querySelectorAll('[data-a]').forEach(b=>{ const on=!!A.on[b.dataset.a] || (b.dataset.a==='still' && sysStill.matches); b.setAttribute('aria-pressed', on); b.querySelector('.st').textContent = on ? 'פועל' : 'כבוי'; });
  $('zoomReset').textContent = Math.round(A.zoom*100)+'%';
  $('zoomIn').disabled = A.zoom===ZOOMS[ZOOMS.length-1]; $('zoomOut').disabled = A.zoom===ZOOMS[0];
  $('a11yDot').hidden = !a11yChanged();
}
function setZoom(dir){ const i=ZOOMS.indexOf(A.zoom); const n = dir===0 ? 1 : ZOOMS[Math.min(ZOOMS.length-1, Math.max(0, i+dir))]; A.zoom=n; saveA11y(); applyA11y(); announce(`גודל טקסט ${Math.round(n*100)}%`); }
$('a11yBtn').onclick=()=>togglePopup($('a11yBtn'),$('a11yPanel'));
$('a11yClose').onclick=()=>closePopup();
$('zoomIn').onclick=()=>setZoom(1); $('zoomOut').onclick=()=>setZoom(-1); $('zoomReset').onclick=()=>setZoom(0);
document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{ theme=b.dataset.themeSet; saveA11y(); applyA11y(); announce({auto:'ערכת צבעים אוטומטית לפי הגדרות המחשב',light:'מצב יום',dark:'מצב לילה'}[theme]); });
$('a11yToggles').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const k=b.dataset.a; A.on[k]=!A.on[k]; saveA11y(); applyA11y(); announce(`${b.querySelector('.tx').textContent} ${A.on[k]?'הופעל':'כובה'}`); });
$('a11yReset').onclick=()=>{ stopRead(true); A.zoom=1; A.on={}; theme='auto'; saveA11y(); applyA11y(); announce('הגדרות הנגישות אופסו'); };
$('skipLink').onclick=e=>{ e.preventDefault(); $('main').focus(); $('main').scrollIntoView(); };
sysStill.addEventListener && sysStill.addEventListener('change', applyA11y);

/* ---------------- הקראת העמוד ---------------- */
const RD={on:false,paused:false,list:[],i:0,run:0,voice:null,utt:null};
const synthOK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function pickVoice(){ if(!synthOK) return; const v=speechSynthesis.getVoices(); RD.voice = v.find(x=>/^(he|iw)/i.test(x.lang)) || null; }
if(synthOK){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
else { $('readBtn').disabled=true; $('readNote').textContent='הדפדפן הזה לא תומך בהקראה. אפשר להשתמש בקורא מסך או בדפדפן אחר.'; }
const READ_SEL='#where, main .crumb, main h1, main h2, main h4, main p, main li, main tr, main .qq, main .opt, main .why, main .note, main .anat-panel, main .persona, main .cert, main .count, #siteFoot';
function readTargets(){
  const all=[...document.querySelectorAll(READ_SEL)].filter(el=>el.getClientRects().length && getComputedStyle(el).visibility!=='hidden');
  const set=new Set(all);
  return all.filter(el=>{ let p=el.parentElement; while(p){ if(set.has(p)) return false; p=p.parentElement; } return true; });
}
function textOf(el){
  if(el.matches('tr')) return [...el.cells].map(c=>c.innerText.trim()).filter(Boolean).join(', ');
  return (el.getAttribute('aria-label') || el.innerText || '').replace(/\s+/g,' ').trim();
}
function clearMark(){ document.querySelectorAll('.a-reading').forEach(x=>x.classList.remove('a-reading')); }
function speakNext(run){
  if(!RD.on || run!==RD.run) return;
  while(RD.i<RD.list.length && !textOf(RD.list[RD.i])) RD.i++;
  if(RD.i>=RD.list.length){ stopRead(true); announce('ההקראה הסתיימה'); return; }
  const el=RD.list[RD.i]; clearMark(); el.classList.add('a-reading');
  el.scrollIntoView({block:'center', behavior: document.documentElement.classList.contains('a-still') ? 'auto' : 'smooth'});
  const u=new SpeechSynthesisUtterance(textOf(el)); u.lang='he-IL'; if(RD.voice) u.voice=RD.voice;
  u.onend=()=>{ if(run!==RD.run) return; RD.i++; speakNext(run); };
  u.onerror=ev=>{ if(run!==RD.run || ev.error==='interrupted' || ev.error==='canceled') return; RD.i++; speakNext(run); };
  RD.utt=u; speechSynthesis.speak(u);
}
function startRead(){
  if(!synthOK) return;
  RD.run++; speechSynthesis.cancel();
  RD.list=readTargets(); RD.i=0; RD.on=true; RD.paused=false;
  $('readNote').textContent = RD.voice ? '' : 'לא נמצא קול עברי במערכת. ההקראה תתבצע בקול ברירת המחדל.';
  updateReadUI(); announce('ההקראה התחילה. Esc עוצר.');
  const run=RD.run; setTimeout(()=>speakNext(run),60);
}
function stopRead(silent){
  if(!synthOK) return;
  const was=RD.on; RD.run++; RD.on=false; RD.paused=false; speechSynthesis.cancel(); clearMark(); updateReadUI();
  if(was && !silent) announce('ההקראה נעצרה');
}
function togglePause(){
  if(!RD.on) return;
  if(RD.paused){ speechSynthesis.resume(); RD.paused=false; } else { speechSynthesis.pause(); RD.paused=true; }
  updateReadUI(); announce(RD.paused?'ההקראה הושהתה':'ההקראה ממשיכה');
}
function updateReadUI(){
  $('readBtn').setAttribute('aria-pressed', RD.on); $('readBtn').textContent = RD.on ? '▶ מקריא…' : '▶ הקראה';
  $('pauseBtn').disabled=!RD.on; $('pauseBtn').textContent = RD.paused ? 'המשך' : 'השהיה';
  $('stopBtn').disabled=!RD.on; $('stopReadTop').hidden=!RD.on;
  $('a11yDot').hidden = !a11yChanged();
}
$('readBtn').onclick=()=>{ closePopup(false); startRead(); };
$('pauseBtn').onclick=togglePause;
$('stopBtn').onclick=()=>stopRead();
$('stopReadTop').onclick=()=>stopRead();

/* ---------------- כותרת תחתונה ---------------- */
function ltr(t){ return t.replace(/([A-Za-z][A-Za-z0-9\-. ]*[A-Za-z0-9]|\d+(?:[.:]\d+)*)/g,'\u200E$1\u200E'); }
function footerText(){ return ltr(`${CONFIG.unit} · ${CONFIG.course} · גרסה ${CONFIG.appVersion} · נשמר ${CONFIG.saved}`); }

/* ---------------- ⓘ מידע מורחב ולא מאומת ---------------- */
const viTip=document.createElement('div'); viTip.id='viTip'; viTip.hidden=true; viTip.setAttribute('aria-hidden','true'); document.body.appendChild(viTip);
let viCur=null, viPinned=false;
function showTip(btn){
  if(viCur && viCur!==btn) viCur.setAttribute('aria-expanded','false');
  viCur=btn; btn.setAttribute('aria-expanded','true');
  viTip.innerHTML=`<b>מידע מורחב ולא מאומת</b>${esc(btn.dataset.note)}`; viTip.hidden=false;
  const r=btn.getBoundingClientRect(), w=viTip.offsetWidth, h=viTip.offsetHeight;
  let left=Math.min(Math.max(12, r.left+r.width/2-w/2), innerWidth-w-12);
  let top=r.top-h-8; if(top<8) top=r.bottom+8;
  viTip.style.left=left+'px'; viTip.style.top=top+'px';
}
function hideTip(force){ if(viPinned && !force) return; viPinned=false; viTip.hidden=true; if(viCur){ viCur.setAttribute('aria-expanded','false'); viCur=null; } }
document.addEventListener('mouseover',e=>{ const b=e.target.closest('.vi'); if(b && !viPinned) showTip(b); });
document.addEventListener('mouseout',e=>{ const b=e.target.closest('.vi'); if(b && !viPinned) hideTip(); });
document.addEventListener('focusin',e=>{ const b=e.target.closest('.vi'); if(b) showTip(b); else if(!viPinned) hideTip(); });
document.addEventListener('click',e=>{ const b=e.target.closest('.vi'); if(b){ e.preventDefault(); if(viPinned && viCur===b){ hideTip(true); } else { viPinned=true; showTip(b); } return; } if(viPinned) hideTip(true); }, true);
window.addEventListener('scroll',()=>hideTip(true),{passive:true});
window.addEventListener('resize',()=>hideTip(true));

/* ---------------- הפעלה ---------------- */
applyA11y();
load();
const h=location.hash.slice(1); if(h && validId(h)) state.current=h;
render();
</script>
</body>
